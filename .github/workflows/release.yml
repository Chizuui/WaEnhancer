name: Android Release CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.5.5)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decrypt and Write Release Keystore
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
        run: |
          if [ -n "$RELEASE_KEY_STORE" ]; then
            echo androidStorePassword='${{ secrets.RELEASE_KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.RELEASE_KEY_ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.RELEASE_KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='release_key.jks' >> gradle.properties
            echo "$RELEASE_KEY_STORE" | base64 --decode > release_key.jks
          else
            echo "Warning: RELEASE_KEY_STORE secret not set, build might fall back to debug key."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleWhatsappRelease assembleBusinessRelease -Pminify=true

      - name: Get Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: WaEnhancer Release ${{ steps.get_tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/whatsapp/release/app-whatsapp-release.apk
            app/build/outputs/apk/business/release/app-business-release.apk
